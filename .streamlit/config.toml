[theme]
base = "light"
primaryColor = "#1f5fd6"
backgroundColor = "#f5f9ff"
secondaryBackgroundColor = "#e6efff"
textColor = "#14315c"

# Privacy: no usage statistics are sent to Streamlit, and error messages never show details
# (a full error could print part of someone's data on screen).
[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
maxUploadSize = 10
# smaller messages between the server and the browser, so the live app feels quicker on slow connections
enableWebsocketCompression = true
